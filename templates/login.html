<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - HantaMed Assist</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-container { max-width: 400px; margin: 4rem auto; padding: 2rem; }
        .login-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #334155; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #0F4C75; box-shadow: 0 0 0 3px rgba(15,76,117,0.1); }
        .btn-primary { width: 100%; padding: 0.75rem; background: #0F4C75; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #0a3a5c; }
        .error-msg { color: #dc2626; margin-bottom: 1rem; font-size: 0.9rem; }
        .back-link { display: inline-block; margin-top: 1rem; color: #64748b; text-decoration: none; }
        .back-link:hover { color: #0F4C75; }
    </style>
</head>
<body>
    <nav aria-label="Ana menü">
        <div class="nav-content">
            <h1>🛡️ HantaMed Assist</h1>
            <div class="nav-links">
                <a href="/">Ana Sayfa</a>
                <a href="/legal">Yasal Bilgilendirme</a>
            </div>
        </div>
    </nav>
    
    <main class="container">
        <div class="login-container">
            <div class="login-card">
                <h2 style="text-align:center;margin-bottom:1.5rem;color:#0F4C75">🔐 Yönetici Girişi</h2>
                
                {% if error %}
                <div class="error-msg" role="alert">{{ error }}</div>
                {% endif %}
                
                <form method="post" action="/login">
                    <div class="form-group">
                        <label for="username">Kullanıcı Adı</label>
                        <input type="text" id="username" name="username" required autocomplete="username" autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Şifre</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-primary">Giriş Yap</button>
                </form>
                
                <a href="/" class="back-link">← Ana sayfaya dön</a>
            </div>
        </div>
    </main>
    
    <footer>
        <div class="disclaimer-footer">
            Bu sistem yalnızca bilgilendirme amaçlıdır. Teşhis, tedavi veya ilaç önerisi yapmaz. Tüm kararlar için yetkili hekime danışın.
        </div>
    </footer>
</body>
</html>
